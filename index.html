    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', -apple-system, sans-serif; }
        
        body { 
            background: radial-gradient(circle at 50% 0%, #2a0808 0%, #0c0505 50%, #030102 100%); 
            color: #f8fafc; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            position: relative;
            overflow-x: hidden;
        }

        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
        }
        .orb-red { width: 280px; height: 280px; background: rgba(239, 68, 68, 0.2); top: -50px; left: 50%; transform: translateX(-50%); }
        .orb-gold { width: 260px; height: 260px; background: rgba(245, 158, 11, 0.12); bottom: -60px; right: -40px; }

        .guard-card {
            width: 100%;
            max-width: 440px;
            background: rgba(18, 12, 12, 0.82);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid rgba(239, 68, 68, 0.28);
            border-radius: 32px;
            padding: 26px 20px;
            text-align: center;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            position: relative;
            z-index: 10;
            animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: scale(0.92) translateY(24px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .icon-wrap {
            width: 68px;
            height: 68px;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.25), rgba(185, 28, 28, 0.1));
            border: 1.5px solid rgba(239, 68, 68, 0.5);
            border-radius: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 0 35px rgba(239, 68, 68, 0.4), inset 0 0 15px rgba(239, 68, 68, 0.2);
            position: relative;
        }

        .icon-wrap::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 28px;
            border: 1px solid rgba(239, 68, 68, 0.35);
            animation: pulseRing 2.2s infinite ease-out;
        }

        @keyframes pulseRing {
            0% { transform: scale(0.96); opacity: 0.8; }
            70% { transform: scale(1.15); opacity: 0; }
            100% { transform: scale(1.15); opacity: 0; }
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 900;
            letter-spacing: 0.8px;
            color: #ffffff;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .card-subtitle {
            font-size: 0.95rem;
            font-weight: 800;
            color: #f87171;
            margin-bottom: 14px;
        }

        .authorized-info-text {
            font-size: 0.78rem;
            color: #94a3b8;
            margin-bottom: 10px;
            text-align: left;
            padding-left: 2px;
        }

        .list-box {
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 8px;
            margin-bottom: 16px;
            text-align: left;
            max-height: 170px;
            overflow-y: auto;
        }

        .domain-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            margin-bottom: 6px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .domain-row:last-child { margin-bottom: 0; }

        .domain-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: #fef08a;
            font-weight: 600;
            max-width: 190px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .domain-actions { display: flex; gap: 6px; }

        .btn-action {
            padding: 5px 10px;
            border-radius: 9px;
            font-size: 0.72rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease;
        }
        .btn-action:active { transform: scale(0.95); }
        .btn-copy { background: rgba(255, 255, 255, 0.1); color: #e2e8f0; border: 1px solid rgba(255, 255, 255, 0.15); }
        .btn-copy:hover { background: rgba(255, 255, 255, 0.18); color: #fff; }
        .btn-open { background: #f59e0b; color: #000; font-weight: 800; }
        .btn-open:hover { background: #fbbf24; }

        .promo-container {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.12), rgba(239, 68, 68, 0.1));
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 18px;
            padding: 13px 14px;
            margin-bottom: 18px;
            text-align: left;
        }

        .promo-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.68rem;
            font-weight: 800;
            color: #ffbd14;
            background: rgba(245, 158, 11, 0.2);
            padding: 2px 7px;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .promo-text {
            font-size: 0.78rem;
            color: #f1f5f9;
            line-height: 1.45;
            font-weight: 600;
        }

        .promo-highlight {
            color: #ffbd14;
            font-weight: 700;
        }

        .tg-pulse-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            width: 100%;
            padding: 14px 20px;
            border-radius: 18px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000000;
            font-weight: 900;
            font-size: 0.92rem;
            text-decoration: none;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.45);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .tg-pulse-btn:hover {
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.65);
            transform: translateY(-1px);
        }
        .tg-pulse-btn:active { transform: scale(0.98); }

        .footer-watermark {
            margin-top: 16px;
            font-size: 0.72rem;
            color: #64748b;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .footer-watermark b { color: #ffbd14; font-weight: 800; }

        #toastNotice {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(50px);
            background: #10b981;
            color: #000;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.75rem;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 50;
        }
        #toastNotice.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .pass-box { margin-top: 10px; }
        .pass-input {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #3f3f46;
            border-radius: 12px;
            color: #fff;
            font-size: 0.85rem;
            margin-bottom: 10px;
            outline: none;
        }
        .pass-btn {
            width: 100%;
            padding: 11px;
            background: #f59e0b;
            color: #000;
            font-weight: 800;
            border-radius: 12px;
            border: none;
            cursor: pointer;
        }
    </style>
